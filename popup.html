<!DOCTYPE html>
<html lang="en">
  <meta charset="utf-8" /><title>Yandex → GPX</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      width: 360px;
      margin: 0;
      padding: 16px;
      font: 14px system-ui;
      background: #fafaf7;
      color: #20251e;
    }
    h1 {
      font-size: 20px;
    }
    h1 img {
      vertical-align: middle;
      margin-right: 8px;
    }
    p {
      line-height: 1.4;
      color: #52584f;
    }
    button,
    input,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #b8c0b4;
      border-radius: 9px;
      font: inherit;
    }
    button {
      background: #246b3a;
      color: white;
      min-height: 44px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
    }
    label {
      display: block;
      margin: 10px 0;
      font-size: 12px;
    }
    input,
    select {
      margin-top: 4px;
    }
    h2 {
      font-size: 13px;
      margin: 12px 0 6px;
    }
    ol {
      padding-left: 25px;
    }
    li {
      padding: 4px 0;
      overflow-wrap: anywhere;
    }
    li::marker {
      color: #246b3a;
      font-weight: 600;
    }
    svg {
      width: 100%;
      height: 120px;
      background: #eef1e9;
      border-radius: 9px;
    }
    polyline {
      fill: none;
      stroke: #2872bc;
      stroke-width: 2.5;
      vector-effect: non-scaling-stroke;
    }
    .hint,
    #status,
    #summary {
      font-size: 12px;
    }
    #back {
      background: transparent;
      color: #246b3a;
    }
    [hidden] {
      display: none !important;
    }
    #status:empty {
      display: none;
    }
  </style>
  <section id="intro">
    <h1>
      <img src="icons/icon48.png" width="28" height="28" alt="" />Yandex → GPX
    </h1>
    <p>Open a route in Yandex Maps, then export it for Speedometer GPS.</p>
    <button id="read">Read route</button>
  </section>
  <section id="result" hidden>
    <button id="download">Download GPX</button>
    <p id="summary"></p>
    <label id="variant" hidden>Route option<select id="routes"></select></label
    ><label>Route name<input id="name" maxlength="160" /></label>
    <h2>Stops</h2>
    <ol id="stops"></ol>
    <h2>Route preview</h2>
    <svg viewBox="0 0 320 145" role="img" aria-label="Route outline">
      <polyline id="line" />
    </svg>
    <p class="hint">
      Check the stops and outline. Yandex may recalculate the route when it is
      read.
    </p>
    <button id="back">Read another route</button>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="popup.js" type="module"></script>
</html>
